name: Yayın (güncelleme)
on:
  push:
    branches: [main]
    paths: ['www/**', 'tools/gen_audio.py', 'tools/extract.js', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
    environment: {name: github-pages, url: '${{ steps.d.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/cache@v4
        with:
          path: audio-cache
          key: audio-${{ env.AZURE_SPEECH_KEY != '' && 'azure' || 'piper' }}-v1-${{ hashFiles('www/index.html') }}
          restore-keys: audio-${{ env.AZURE_SPEECH_KEY != '' && 'azure' || 'piper' }}-v1-
      - name: Sesleri üret (Piper)
        continue-on-error: true
        run: |
          set -o pipefail
          [ -n "$AZURE_SPEECH_KEY" ] || which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          (([ -n "$AZURE_SPEECH_KEY" ] || pip install sherpa-onnx numpy) && node tools/extract.js && python tools/gen_audio.py) 2>&1 | tee audio_report.txt
      - name: Raporu repoya yaz
        if: always()
        run: |
          mkdir -p reports && (grep -v '^HATA' audio_report.txt | head -40; grep -c '^HATA' audio_report.txt; grep '^HATA' audio_report.txt | head -5) > reports/audio.txt || echo "rapor yok" > reports/audio.txt
          git config user.name "build-bot" && git config user.email "bot@users.noreply.github.com"
          git add reports/audio.txt && (git commit -qm "ses raporu" && git push) || true
      - uses: actions/upload-pages-artifact@v3
        with: {path: www}
      - id: d
        uses: actions/deploy-pages@v4
