name: Ses denemesi
on:
  workflow_dispatch:
    inputs:
      engine: {description: 'xtts, chatterbox veya hepsi', default: 'hepsi'}
permissions: {contents: write}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: XTTS-v2
        if: inputs.engine != 'chatterbox'
        continue-on-error: true
        run: |
          python -m venv vx && . vx/bin/activate
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q coqui-tts 'transformers>=4.48,<4.57'
          python tools/ses_test.py xtts 2>&1 | tee xtts.log
      - name: Chatterbox
        if: inputs.engine != 'xtts'
        continue-on-error: true
        run: |
          python -m venv vc && . vc/bin/activate
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts
          python tools/ses_test.py chatterbox 2>&1 | tee chatterbox.log
      - name: Sonuçları repoya yaz
        if: always()
        run: |
          mkdir -p reports; (echo XTTS; tail -n 25 xtts.log; echo; echo CHATTERBOX; tail -n 6 chatterbox.log) > reports/ses_test.txt 2>&1 || true
          git config user.name build-bot && git config user.email bot@users.noreply.github.com
          git add -A www/test-audio reports && (git commit -qm "ses denemesi" && git pull -q --rebase && git push) || true
