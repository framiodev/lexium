name: APK derle
on:
  push:
    branches: [main]
    paths: ['capacitor.config.json','tools/**','icinde.keystore','package.json','.github/workflows/apk.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - run: pip install pillow && python tools/prepare_android.py
        env: {GITHUB_RUN_NUMBER: '${{ github.run_number }}'}
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk lexium.apk
      - name: Release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest lexium.apk --title "Lexium (APK)" --notes "Telefona indirip kur."
