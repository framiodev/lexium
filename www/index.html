<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B0E13"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Lexium</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: tek sütunlu telefon uygulaması; altta sabit sekme çubuğu, üstte yapışkan başlık, dersler adım adım açılan liste.
   Kimlik: film altyazısı. İngilizce cümleler koyu bir altyazı çubuğunda sarı harflerle görünür. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface2:#E8ECF0; --line:#D3DAE1;
  --fg:#10161C; --muted:#55636E;
  --accent:#FFD23F; --on-accent:#1B1500; --accent-text:#7A5A00;
  --ok:#1E8A58; --warn:#A8620A; --bad:#C23B47; --focus:#2563EB;
  --sub-bg:#0B0E12; --sub-fg:#FFD23F;
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1217; --surface:#151C23; --surface2:#1E2832; --line:#2A3540;
    --fg:#E7ECF1; --muted:#97A5B1;
    --accent-text:#FFD23F; --ok:#4CC38A; --warn:#F2A93B; --bad:#F0707A; --focus:#6CA8FF;
    --sub-bg:#05070A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface2:#1E2832; --line:#2A3540;
  --fg:#E7ECF1; --muted:#97A5B1;
  --accent-text:#FFD23F; --ok:#4CC38A; --warn:#F2A93B; --bad:#F0707A; --focus:#6CA8FF;
  --sub-bg:#05070A; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{max-width:560px;margin-inline:auto;padding-inline:16px;padding-block:0 104px;min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:12px 10px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.2rem;letter-spacing:-.01em}
.brand i{font-style:normal;background:var(--sub-bg);color:var(--sub-fg);padding:1px 8px;border-radius:5px;margin-left:2px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:40px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:0 10px;flex:none}
.ibtn.sm{min-width:36px;height:36px;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.ibtn svg{width:18px;height:18px;fill:currentColor}
.ibtn.play{color:var(--accent-text)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--muted);border-top:3px solid transparent;min-width:0}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--accent-text);border-top-color:var(--accent)}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:1.85rem;line-height:1.1;font-weight:800}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.05rem;font-weight:800}
h4{font-size:.78rem;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;font-weight:500}
p{margin:0}
.muted{color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:12px;padding-block:16px}
.hero{display:flex;flex-direction:column;gap:10px;padding-block:18px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.chip.hi{background:var(--sub-bg);color:var(--sub-fg);border-color:var(--sub-bg)}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav .mid{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);text-align:center;flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.steps{display:flex;flex-direction:column;gap:8px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step.on{border-color:var(--accent)}
.step>button{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;text-align:left;min-height:56px}
.num{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:.85rem;flex:none;color:var(--muted)}
.step.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.num svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.st-t{font-weight:700;display:block}
.st-d{font-size:.84rem;color:var(--muted);display:block}
.st-m{margin-left:auto;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);flex:none}
.panel{padding:2px 14px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.panel>*:first-child{margin-top:12px}
ol.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.links{display:flex;flex-direction:column;gap:6px}
.links a{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;color:var(--fg);text-decoration:none;background:var(--surface2);font-weight:600;font-size:.92rem}
.links a span{color:var(--accent-text);font-family:var(--f-mono);font-size:.78rem;flex:none}
.ph{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ph:last-child{border-bottom:0}
.ph-t{flex:1;min-width:0}
.en{font-family:var(--f-display);font-weight:600;font-size:1.05rem;line-height:1.25;overflow-wrap:anywhere}
.tr{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.ok{font-family:var(--f-mono);font-size:.78rem;color:var(--accent-text);margin-top:2px;overflow-wrap:anywhere}
.sub{background:var(--sub-bg);color:var(--sub-fg);border-radius:6px;padding:.55em .85em;font-family:var(--f-display);font-weight:600;font-size:clamp(1.3rem,6vw,1.75rem);line-height:1.25;text-align:center;text-wrap:balance;overflow-wrap:anywhere;border:1px solid var(--line)}
.scroll{overflow-x:auto}
table.tb{border-collapse:collapse;width:100%;font-size:.92rem}
.tb th,.tb td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tb th{font-family:var(--f-mono);font-weight:500;color:var(--accent-text);white-space:nowrap;font-size:.84rem}
.exr{display:flex;gap:10px;align-items:center;padding:6px 0}
.mis{display:grid;gap:2px;padding:8px 10px;border-radius:8px;background:var(--surface2);margin-bottom:6px;font-size:.92rem}
.mis s{color:var(--bad)}
.mis b{color:var(--ok);font-weight:600}
.mis span{color:var(--muted);font-size:.84rem}
.dl{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
.dl .who{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);width:54px;flex:none;padding-top:9px;overflow:hidden;text-overflow:ellipsis}
.dl .en{flex:1;min-width:0;padding-top:6px}
.env{border-left:3px solid var(--accent);padding-left:12px;display:flex;flex-direction:column;gap:6px}
.env.done{border-left-color:var(--ok)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-weight:600;font-size:.9rem}
select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 12px;font:inherit}
input[type=date]{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 12px;font:inherit}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:10px 6px;font-weight:600;font-size:.86rem;min-height:44px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.sheet-in{max-width:560px;margin-inline:auto;padding-inline:16px;padding-block:0 40px}
.sheet-top{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:calc(12px + env(safe-area-inset-top,0px)) 10px;border-bottom:1px solid var(--line);z-index:2}
.stage{display:flex;flex-direction:column;gap:16px;padding-block:20px}
.prompt{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,7vw,2rem);text-align:center;text-wrap:balance;line-height:1.2}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;min-height:58px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.rate button small{font-family:var(--f-mono);font-weight:400;color:var(--muted);font-size:.7rem}
.rate .r0{border-color:var(--bad)}
.rate .r3{border-color:var(--ok)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;min-height:50px;font-weight:600}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.fb{padding:10px 12px;border-radius:10px;background:var(--surface2);font-size:.92rem}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.7rem;font-weight:800;line-height:1.1}
.stat span{font-size:.82rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:34px repeat(7,1fr);gap:6px;align-items:center}
.grid .wl{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.cell{aspect-ratio:1/1;min-height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:.72rem;color:var(--muted);padding:0}
.cell.part{background:color-mix(in srgb,var(--accent) 35%,var(--surface));color:var(--fg);border-color:transparent}
.cell.full{background:var(--ok);color:#fff;border-color:transparent}
.cell.now{outline:2px solid var(--focus);outline-offset:1px}
.cell.fut{opacity:.55}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;min-height:56px}
.list-row:last-child{border-bottom:0}
.list-row .tt{flex:1;min-width:0}
.list-row .tt b{display:block}
.list-row .tt span{font-size:.84rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.l{background:var(--warn)}.dot.m{background:var(--ok)}
.search{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 12px;font:inherit}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--sub-bg);color:var(--sub-fg);padding:10px 16px;border-radius:10px;z-index:80;font-weight:600;max-width:calc(100% - 32px);text-align:center;border:1px solid var(--line)}
.flowbtn{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;margin-inline:auto}
.flowbtn svg{width:34px;height:34px;fill:currentColor}
.note{font-size:.86rem;color:var(--muted)}
.tm{font-family:var(--f-mono);font-size:1.6rem;font-weight:500;text-align:center}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}

function nextInt(c,q){
  if(q===0) return 0;
  if(q===1) return Math.max(1,Math.round((c.i||1)*1.2));
  if(q===2) return c.r===0?1:(c.r===1?3:Math.round(c.i*c.e));
  return c.r===0?4:Math.max(4,Math.round((c.i||1)*c.e*1.3));
}
function lbl(c,q){ var i=nextInt(c,q); if(q===0) return 'şimdi'; if(i<30) return i+' gün'; return Math.round(i/30)+' ay'; }
function rate(id,q){
  var c=S.srs[id]; if(!c) return;

}

function pickVoice(lang){
  var pre=lang==='en'?['en-US','en_US','en-GB','en_GB']:['tr-TR','tr_TR'];
  for(var i=0;i<pre.length;i++){ var f=voices.find(function(v){return v.lang===pre[i];}); if(f) return f; }
  return voices.find(function(v){return v.lang.toLowerCase().indexOf(lang)===0;})||null;
}
var AIDX=null, AURL={}, CUR=null, SAYT=0;
try{ fetch('audio/index.json').then(function(r){return r.ok?r.json():null;}).then(function(j){AIDX=j;}).catch(function(){}); }catch(e){}
function vkey(v){ return v==='m'?'m':(v==='f'?'f':(S.settings.voice==='m'?'m':'f')); }
function clipUrl(h,v){
  var k=h+'-'+v; if(AURL[k]) return Promise.resolve(AURL[k]);
  return fetch('audio/'+k+'.mp3').then(function(r){ if(!r.ok) throw 0; return r.blob(); }).then(function(b){ AURL[k]=URL.createObjectURL(b); return AURL[k]; });
}
function sayClip(text,lang,rate,v){
  var h=AIDX&&AIDX[lang+'|'+text]; if(!h) return Promise.reject();
  return clipUrl(h,vkey(v)).then(function(u){
    return new Promise(function(res,rej){
      var a=new Audio(u); CUR=a; a.preservesPitch=true; a.playbackRate=Math.min(2,Math.max(0.5,rate||1));
      var done=false; a.onended=function(){ if(!done){done=true;res();} };
      a.onerror=function(){ if(!done){done=true;rej();} };
      var pr=a.play(); if(pr&&pr.catch) pr.catch(function(){ if(!done){done=true;rej();} });
    });
  });
}
function sayTTS(text,lang,rate){
  return new Promise(function(res){
    if(!('speechSynthesis' in window)){res();return;}
    var u=new SpeechSynthesisUtterance(text);
    u.lang=lang==='en'?'en-US':'tr-TR';
    var v=pickVoice(lang); if(v){u.voice=v;u.lang=v.lang;}
    u.rate=rate||S.settings.rate;
    var done=false, to;
    var fin=function(){ if(!done){done=true;clearTimeout(to);res();} };
    u.onend=fin; u.onerror=fin;
    to=setTimeout(fin,3500+text.length*170/(u.rate||1));
    setTimeout(function(){ try{speechSynthesis.speak(u);}catch(e){fin();} },40);
  });
}

function rng(seed){ var a=seed>>>0; return function(){ a|=0;a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- Testler ---------- */
var Q=null;
function gq(q,seed){ var o=q[1].map(function(t,k){return {t:t,ok:k===q[2]};}); return {k:'g',p:q[0],opts:shuffle(o,seed+Date.now()),exp:q[3]}; }
function pq(c,pool,kind,seed){
  var others=shuffle(pool.filter(function(x){return x.id!==c.id&&x.tr!==c.tr&&x.en!==c.en;}),seed).slice(0,2);
  var o=(kind==='l'?[{t:c.tr,ok:true}].concat(others.map(function(x){return {t:x.tr,ok:false};})):[{t:c.en,ok:true}].concat(others.map(function(x){return {t:x.en,ok:false};})));
  return {k:kind,id:c.id,en:c.en,tr:c.tr,opts:shuffle(o,seed+Date.now())};
}
function buildQuiz(o){
  var qs=[], n=o.day;
  if(o.gram!=null){ W[o.gram].g.q.forEach(function(q,i){qs.push(gq(q,o.gram*10+i));}); return qs; }
  var I=info(n);
  if(I.w){
    I.w.g.q.forEach(function(q,i){qs.push(gq(q,n*7+i));});
    var pool=CARDS.filter(function(c){return c.w===I.wi;});
    shuffle(cardsOf(I.wi,I.di),n).slice(0,3).forEach(function(c,k){qs.push(pq(c,pool,k%2===0?'l':'r',n+k));});
  }else{
    var all=CARDS.filter(function(c){return S.srs[c.id];}); if(all.length<10) all=CARDS.slice();
    shuffle(all,n).slice(0,10).forEach(function(c,k){qs.push(pq(c,CARDS.filter(function(x){return x.w===c.w;}),k%2===0?'l':'r',n+k));});
  }
  return qs;
}
function openQuiz(o,title,mark){ Q={qs:buildQuiz(o),i:0,sc:0,sel:null,mark:mark,title:title}; renderQ(); }
function renderQ(){
  if(Q.i>=Q.qs.length){ finishQ(); return; }
  var q=Q.qs[Q.i];
  var head=q.k==='g'?'<div class="prompt">Boşluğu doldur</div><div class="big">'+esc(q.p)+'</div>':(q.k==='l'?'<div class="prompt">Dinle ve anlamını seç</div><button class="flowbtn" data-act="qplay" aria-label="Dinle">'+IC.play+'</button>':'<div class="prompt">İngilizcesini seç</div><div class="big">'+esc(q.tr)+'</div>');
  var opts='<div class="opts">'+q.opts.map(function(o,k){var cls='opt';if(Q.sel!=null){if(o.ok)cls+=' right';else if(k===Q.sel)cls+=' wrong';}return '<button class="'+cls+'" data-act="qpick" data-k="'+k+'"'+(Q.sel!=null?' disabled':'')+'>'+esc(o.t)+'</button>';}).join('')+'</div>';
  var fb='';
  if(Q.sel!=null){ var good=q.opts[Q.sel].ok; fb='<div class="fb"><b>'+(good?'Doğru.':'Yanlış.')+'</b> '+(q.k==='g'?esc(q.exp):esc(q.en)+' = '+esc(q.tr))+'</div><button class="btn block" data-act="qnext">'+(Q.i+1>=Q.qs.length?'Bitir':'Sonraki')+'</button>'; }
  openSheet(sheetTop(Q.title,counter((Q.i+1)+' / '+Q.qs.length))+'<div class="stage">'+head+opts+fb+'</div>');
  if(q.k==='l'&&Q.sel==null) play(q.en);
}
function finishQ(){
  var t=Q.qs.length, s=Q.sc, mark=Q.mark;
  S.q.push({n:mark||0,s:s,t:t,ts:Date.now()}); S.q=S.q.slice(-60);
  if(mark) setStep(mark,defs(mark)===STF?2:5,true); else save();
  var msg=s===t?'Hepsi doğru.':(s/t>=0.7?'İyi gidiyorsun. Yanlışlarını kartlar tekrar soracak.':'Sorun değil. Yapı sekmesinden konuyu tekrar oku, sonra yine dene.');
  openSheet(sheetTop('Sonuç')+'<div class="stage"><div class="big">'+s+' / '+t+'</div><p class="muted" style="text-align:center">'+msg+'</p><button class="btn block" data-act="close">Kapat</button></div>');
}

var F={run:false,tok:0,idx:0,mode:'dinle',src:'today'}, WL=null;
function wake(){ try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(function(l){WL=l;}).catch(function(){}); }catch(e){} }
function unwake(){ try{ if(WL) WL.release(); }catch(e){} WL=null; }
function flowList(){
  var I=info(UI.day), l;
  if(F.src==='today') l=I.w?cardsOf(I.wi,I.di):CARDS.filter(function(c){return S.srs[c.id];});
  else if(F.src==='week') l=I.w?CARDS.filter(function(c){return c.w===I.wi;}):CARDS.slice();
  else l=CARDS.filter(function(c){return S.srs[c.id];});
  if(!l.length) l=I.w?cardsOf(I.wi,I.di):CARDS.slice();
  return l;
}
function showFlow(c,idx,hide){
  var a=$('#fEn'),b=$('#fTr'),o=$('#fOk'),k=$('#fCnt'); if(!a) return;
  a.textContent=hide?'···':c.en; b.textContent=c.tr; o.textContent=(c.ok&&S.settings.ok)?c.ok:''; k.textContent=((idx%flowList().length)+1)+' / '+flowList().length;
}
function updFlowBtn(){ var b=$('#fBtn'); if(b){ b.innerHTML=F.run?IC.pause:IC.play; b.setAttribute('aria-label',F.run?'Durdur':'Başlat'); } }
async function flowRun(){
  var t=++F.tok; F.run=true; wake(); updFlowBtn();
  while(F.run&&F.tok===t){
    var list=flowList(), c=list[F.idx%list.length], r=S.settings.rate;
    if(F.mode==='dinle'){
      showFlow(c,F.idx);
      await say(c.en,'en',r); if(F.tok!==t) return; await wait(500);
      await say(c.tr,'tr',1); if(F.tok!==t) return; await wait(500);
      await say(c.en,'en',Math.max(0.5,r*0.8));
    }else{
      showFlow(c,F.idx,true);
      await say(c.tr,'tr',1); if(F.tok!==t) return;
      await wait(2500+c.en.length*110); if(F.tok!==t) return;
      showFlow(c,F.idx); await say(c.en,'en',r);
    }
    if(F.tok!==t) return; await wait(900); F.idx++;
  }
}
function flowStop(){ F.run=false; F.tok++; stopSay(); unwake(); updFlowBtn(); }
function rFlow(){

   '<div class="field"><label><input type="checkbox" id="okc"'+(S.settings.ok?' checked':'')+'> Türkçe okunuşu göster (1. ve 2. hafta)</label></div>'+
   '<h4>Telefonda her an yanında</h4><ol class="how"><li>Bu sayfayı Chrome\'da açabiliyorsan menüden (⋮) "Ana ekrana ekle" de. Uygulama gibi tek dokunuşla açılır.</li><li>Gün içine 3 alarm koy: sabah Isınma, öğle Hızlı 3 dk, akşam günün dersi.</li><li>Yolda, ev işinde veya sıradayken Akış sekmesini aç ve cümleleri duy.</li><li>Telefonunun dilini İngilizce yapmayı 6. haftanın görevinde dene. Gün boyu İngilizceyle karşılaşmak, çalışma saatinin dışında kalan en güçlü araçtır.</li></ol>'+
   '<h4>Sıfırlama</h4>'+(RESET?'<p>Tüm ilerleme ve kartlar silinecek. Emin misin?</p><div class="row"><button class="btn ghost" data-act="reset2" style="border-color:var(--bad);color:var(--bad)">Evet, sıfırla</button><button class="btn ghost" data-act="reset0">Vazgeç</button></div>':'<button class="btn ghost" data-act="reset1">İlerlemeyi sıfırla</button>')+
   '</div>');
}

/* ---------- Eylemler ---------- */
function toTop(){ window.scrollTo(0,0); }
function startSeq(lines){ var t=++SEQ.tok; stopSay(); (async function(){ for(var i=0;i<lines.length;i++){ if(SEQ.tok!==t) return; await say(lines[i].t,'en',lines[i].r,lines[i].v); await wait(450); } })(); }
var ACT={
  tab:function(d){ if(UI.tab==='flow') flowStop(); UI.tab=d.t; render(); toTop(); },
  day:function(d){ UI.day=Math.min(TOTAL,Math.max(1,UI.day+Number(d.d))); UI.open=firstOpen(UI.day); render(); },
  today:function(){ UI.day=curDay(); UI.open=firstOpen(UI.day); render(); },
  goto:function(d){ UI.tab='today'; UI.day=Number(d.n); UI.open=firstOpen(UI.day); render(); toTop(); },
  open:function(d){ var i=Number(d.i); UI.open=(UI.open===i?null:i); render(); },
  step:function(d){ var n=Number(d.n), i=Number(d.i), v=!isDone(n,i); setStep(n,i,v); if(v) UI.open=firstOpen(n); render(); },
  env:function(d){ var n=Number(d.n); S.env[n]=!S.env[n]; save(); render(); },
  play:function(d){ SEQ.tok++; play(d.t); },
  slow:function(d){ SEQ.tok++; play(d.t,true); },
  playday:function(d){ var I=info(Number(d.n)); startSeq(cardsOf(I.wi,I.di).map(function(c){return {t:c.en};})); },
  playdlg:function(d){ var I=info(Number(d.n)), who={}, k=0; startSeq(I.w.dlg.map(function(l){ if(!(l[0] in who)) who[l[0]]=k++; return {t:l[1],v:who[l[0]]%2?'m':'f'}; })); },
  slowdlg:function(d){ var I=info(Number(d.n)), who={}, k=0; startSeq(I.w.dlg.map(function(l){ if(!(l[0] in who)) who[l[0]]=k++; return {t:l[1],r:0.65,v:who[l[0]]%2?'m':'f'}; })); },
  learn:function(d){ var n=Number(d.n), c=addCards(n); setStep(n,2,true); toast(c?c+' kart eklendi':'Kartlar zaten ekli'); UI.open=firstOpen(n); render(); },
  timer:function(){ if(TMR){clearInterval(TMR);TMR=null;} var s=120; var e=$('#tm'); if(e) e.textContent='2:00'; TMR=setInterval(function(){ s--; var el=$('#tm'); if(!el){clearInterval(TMR);TMR=null;return;} if(s<=0){clearInterval(TMR);TMR=null;el.textContent='Süre doldu';return;} el.textContent=Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60); },1000); },
  rdue:function(){ openReview(dueIds().slice(0,40),'Tekrar','due'); },
  rquick:function(){ openReview(quickIds(),'Hızlı tekrar','quick'); },
  rflip:function(){ REV.flip=true; renderRev(); play(BY[REV.q[REV.i]].en); },
  rplay:function(){ play(BY[REV.q[REV.i]].en); },
  rslow:function(){ play(BY[REV.q[REV.i]].en,true); },
  rate:function(d){ var id=REV.q[REV.i], q=Number(d.q); rate(id,q); if(q===0) REV.q.push(id); REV.i++; REV.flip=false; renderRev(); },
  quiz:function(d){ var n=Number(d.n); openQuiz({day:n},n>77?'Karma test':'Gün '+n+' alıştırma',n); },
  gopen:function(d){ var i=Number(d.i), w=W[i]; openSheet(sheetTop('Hafta '+(i+1))+'<div class="stage" style="gap:10px"><h2>'+esc(w.t)+'</h2><div class="chips"><span class="chip hi">'+esc(w.tense)+'</span></div>'+gramHTML(w)+'<button class="btn block" data-act="gquiz" data-i="'+i+'" style="margin-top:12px">5 soruluk alıştırma</button></div>'); },
  gquiz:function(d){ openQuiz({gram:Number(d.i)},'Alıştırma',0); },
  verbs:function(){ openSheet(sheetTop('Düzensiz fiiller')+'<div class="stage"><p class="muted">Cümle içinde söyleyerek öğren: I go, I went, I have gone.</p><div class="scroll"><table class="tb"><tr><th>Yalın</th><th>Geçmiş</th><th>3. hâl</th><th>Anlam</th><th></th></tr>'+VERBS.map(function(v){return '<tr><td><b>'+esc(v[0])+'</b></td><td>'+esc(v[1])+'</td><td>'+esc(v[2])+'</td><td>'+esc(v[3])+'</td><td><button class="ibtn sm play" data-act="play" data-t="'+esc(v[0]+', '+v[1].replace(' / ',', ')+', '+v[2].replace(' / ',', '))+'" aria-label="Dinle">'+IC.play+'</button></td></tr>';}).join('')+'</table></div></div>'); },
  qplay:function(){ play(Q.qs[Q.i].en); },
  qpick:function(d){ if(Q.sel!=null) return; var k=Number(d.k), q=Q.qs[Q.i]; Q.sel=k; var good=q.opts[k].ok; if(good) Q.sc++; else if(q.id){ if(!S.srs[q.id]){S.srs[q.id]={e:2.3,i:0,r:0,due:today()};save();} else rate(q.id,0); } renderQ(); },
  qnext:function(){ Q.i++; Q.sel=null; renderQ(); },
  ftoggle:function(){ if(F.run) flowStop(); else flowRun(); },
  fset:function(d){ var was=F.run; if(was) flowStop(); F[d.k]=d.v; F.idx=0; render(); if(was) flowRun(); },
  settings:function(){ openSettings(); },
  startnow:function(){ var d=new Date(); S.start=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); save(); UI.day=curDay(); UI.open=firstOpen(UI.day); openSettings(); toast('Bugün Gün 1 oldu'); },
  voicetest:function(){ stopSay(); (async function(){ await say('Hello! This is how the app will sound.','en',S.settings.rate); await say('Merhaba! Uygulama böyle konuşacak.','tr',1); })(); },
  reset1:function(){ RESET=true; openSettings(); },
  reset0:function(){ RESET=false; openSettings(); },
  reset2:function(){ S.steps={};S.srs={};S.q=[];S.env={};save(); RESET=false; UI.day=curDay(); UI.open=firstOpen(UI.day); closeSheet(); toast('İlerleme sıfırlandı'); },
  close:function(){ closeSheet(); }
};
document.addEventListener('click',function(e){ var t=e.target.closest('[data-act]'); if(!t||t.disabled) return; var f=ACT[t.dataset.act]; if(f) f(t.dataset,t); });
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='cs'){ var l=$('#cl'); if(l) l.innerHTML=cardList(t.value); }
  if(t.id==='rt'){ S.settings.rate=Number(t.value); var v=$('#rtv'); if(v) v.textContent=S.settings.rate.toFixed(2)+'×'; save(); }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='sd'&&/^\d{4}-\d{2}-\d{2}$/.test(t.value)){ S.start=t.value; save(); UI.day=curDay(); UI.open=firstOpen(UI.day); toast('Başlangıç tarihi güncellendi'); }
  if(t.id==='vc'){ S.settings.voice=t.value; save(); }
  if(t.id==='okc'){ S.settings.ok=t.checked; save(); }
});
document.addEventListener('visibilitychange',function(){ if(document.hidden&&F.run) flowStop(); });

load();
UI.day=curDay(); UI.open=firstOpen(UI.day);
render();
initRemote();
})();


</script>

<script>if("serviceWorker"in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
